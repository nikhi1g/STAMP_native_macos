[project]
name = "stamp-native-macos"
version = "2.1.3"
description = "STAMP 2.1.3 (Statistical Analysis of Metagenomic Profiles) ported to native Apple Silicon macOS"
readme = "architecture.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "PyQt6>=6.7,<7",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "biom-format>=2.1.15,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pyinstaller>=6.10",
    "mpmath>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["stamp"]
